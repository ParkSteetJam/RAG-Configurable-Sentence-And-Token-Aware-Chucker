[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "document-chunker"
version = "0.1.0"
description = "Sentence- and token-aware document chunker with configurable size and overlap"
requires-python = ">=3.9"
dependencies = ["tiktoken>=0.5.0", "pypdf>=4.0.0", "python-docx>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
